
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Friends</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #10152f, #304c89);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      text-align: center;
    }
    h1 { margin-bottom: 8px; }
    p { color: #d9e3ff; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #9caee0;
      background: #fff;
      color: #111;
    }
    button {
      border: 0;
      background: #6c8cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #263a68; }
    #message { overflow-wrap: anywhere; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌍 World Friends</h1>
    <p>Connect with friends around the world.</p>

    <div id="auth">
      <input id="email" type="email" placeholder="Your email" autocomplete="email">
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <button id="signup">Create Account</button>
      <button id="login" class="secondary">Login</button>
    </div>

    <div id="profile" hidden>
      <h2>Welcome! 🎉</h2>
      <p id="userEmail"></p>
      <button id="logout">Logout</button>
    </div>

    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    // Replace these placeholder values with your Firebase web app config.
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "PASTE_YOUR_PROJECT_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    const message = document.getElementById("message");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const authBox = document.getElementById("auth");
    const profile = document.getElementById("profile");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("signup").onclick = async () => {
      try {
        await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
        message.textContent = "Account created successfully!";
      } catch (e) { message.textContent = e.message; }
    };

    document.getElementById("login").onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
        message.textContent = "Login successful!";
      } catch (e) { message.textContent = e.message; }
    };

    document.getElementById("logout").onclick = async () => {
      try { await signOut(auth); message.textContent = "Logged out."; }
      catch (e) { message.textContent = e.message; }
    };

    onAuthStateChanged(auth, user => {
      authBox.hidden = !!user;
      profile.hidden = !user;
      document.getElementById("userEmail").textContent = user?.email || "";
    });
  </script>
</body>
</html>
