
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Friends</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f5ff;
      color: #24324a;
      text-align: center;
      padding: 30px 15px;
    }
    main {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
    }
    input, button {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    input { border: 1px solid #bbb; }
    button {
      background: #2457d6;
      color: white;
      border: none;
      font-size: 16px;
    }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>World Friends</h1>
    <p>Meet new friends around the world.</p>
    <p>A friendly community for adults aged 18 and over.</p>
    <h2>Create Your Profile</h2>
    <input type="text" placeholder="Your display name">
    <input type="number" placeholder="Your age" min="18">
    <input type="text" placeholder="Your country">
    <button onclick="alert('Profile registration will be added soon!')">Join World Friends</button>
    <p>Respect, honesty and friendship for everyone.</p>
    <p>Account deletion and privacy features will be added before launch.</p>
  </main>
</body>
</html>
